<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Trading Platform — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
          background: #080c10;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'JetBrains Mono', monospace;
        }
        body::before {
          content: '';
          position: fixed; inset: 0;
          background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,212,170,0.012) 2px, rgba(0,212,170,0.012) 4px);
          pointer-events: none; z-index: 0;
        }
        .card {
          position: relative; z-index: 1;
          background: #0d1117;
          border: 1px solid #1e2a38;
          border-radius: 12px;
          padding: 44px 40px;
          width: 100%; max-width: 400px;
        }
        .logo { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -0.5px; margin-bottom: 6px; }
        .logo span { color: #00d4aa; }
        .subtitle { font-size: 11px; color: #4a5568; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 36px; }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: #4a5568; margin-bottom: 6px; }
        input[type="text"], input[type="password"] {
          width: 100%; padding: 10px 14px;
          background: #080c10; border: 1px solid #1e2a38; border-radius: 6px;
          color: #cdd9e5; font-family: 'JetBrains Mono', monospace; font-size: 13px;
          outline: none; transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #00d4aa; }
        input::placeholder { color: #2d3748; }

        /* Remember me checkbox */
        .remember-row {
          display: flex; align-items: center; gap: 10px;
          margin-bottom: 20px; cursor: pointer;
        }
        .remember-row input[type="checkbox"] {
          width: 16px; height: 16px; cursor: pointer;
          accent-color: #00d4aa;
        }
        .remember-row span { font-size: 11px; color: #4a5568; }

        .btn {
          width: 100%; padding: 11px;
          background: #00d4aa; border: none; border-radius: 6px;
          color: #080c10; font-family: 'JetBrains Mono', monospace;
          font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
          cursor: pointer; transition: background 0.2s;
        }
        .btn:hover { background: #00bfa0; }

        /* Message boxes */
        .msg {
          border-radius: 6px; padding: 10px 14px;
          font-size: 12px; margin-bottom: 20px; display: none;
        }
        .msg.error   { background: rgba(255,61,113,0.08); border: 1px solid rgba(255,61,113,0.25); color: #ff3d71; }
        .msg.success { background: rgba(0,212,170,0.08);  border: 1px solid rgba(0,212,170,0.25);  color: #00d4aa; }
        .msg.warn    { background: rgba(255,165,2,0.08);  border: 1px solid rgba(255,165,2,0.25);  color: #ffa502; }

        .footer { margin-top: 28px; padding-top: 20px; border-top: 1px solid #1e2a38; font-size: 10px; color: #2d3748; text-align: center; letter-spacing: 0.5px; }
        .session-info { margin-top: 12px; font-size: 10px; color: #2d3748; text-align: center; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">⚡ TRADING<span>PLATFORM</span></div>
    <div class="subtitle">Secure Dashboard Access</div>

    <!-- Messages -->
    <div class="msg error"   id="errorMsg">Invalid username or password</div>
    <div class="msg success" id="successMsg">Logged out successfully</div>
    <div class="msg warn"    id="sessionMsg">⏱ Session expired — please login again</div>

    <!-- Login form -->
    <form action="/login" method="post" id="loginForm">
        <div class="field">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter username" autofocus/>
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password"/>
        </div>

        <!-- FIX: Remember Me checkbox — stays logged in for 30 days -->
        <label class="remember-row">
            <input type="checkbox" name="remember-me" id="rememberMe" checked/>
            <span>Keep me logged in for 30 days</span>
        </label>

        <button type="submit" class="btn">LOGIN →</button>
    </form>

    <div class="session-info">Session stays active for 8 hours · Remember Me = 30 days</div>
    <div class="footer">Indian Intraday Trading Platform · Secured</div>
</div>

<script>
    // Show appropriate message based on URL params
    const params = new URLSearchParams(window.location.search);
    if (params.has('error'))   document.getElementById('errorMsg').style.display   = 'block';
    if (params.has('logout'))  document.getElementById('successMsg').style.display = 'block';
    if (params.has('session')) document.getElementById('sessionMsg').style.display = 'block';

    // If API returned 401 (session expired while on dashboard),
    // the dashboard redirects here with ?session=expired
    if (params.get('session') === 'expired') {
        document.getElementById('sessionMsg').style.display = 'block';
        // Pre-check remember-me for convenience
        document.getElementById('rememberMe').checked = true;
    }
</script>
</body>
</html>
