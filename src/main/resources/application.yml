spring:
  application:
    name: trading-platform

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  session:
    timeout: 28800

  task:
    execution:
      pool:
        core-size: 16
        max-size: 64
        queue-capacity: 10000
        keep-alive: 60s
      thread-name-prefix: trading-

dashboard:
  username: ${DASHBOARD_USERNAME:admin}
  password: ${DASHBOARD_PASSWORD:changeme}
  remember-me-key: ${REMEMBER_ME_KEY:trading-platform-secret-2024}

# ================================
# ZERODHA CONFIG
# ================================
zerodha:
  api-key: ${ZERODHA_API_KEY}
  api-secret: ${ZERODHA_API_SECRET}
  user-id: ${ZERODHA_USER_ID}
  account-id: ${ZERODHA_ACCOUNT_ID}
  password: ${ZERODHA_PASSWORD}
  totp-secret: ${ZERODHA_TOTP_SECRET:}
  redirect-url: ${ZERODHA_REDIRECT_URL:http://localhost:8081/api/auth/callback}
  auto-login: true
  websocket:
    max-reconnects: 20
    reconnect-delay-ms: 5000

# ================================
# TRADING CORE
# ================================
# NOTE: trading.capital is now only a FALLBACK — real per-strategy capital
# (AI vs News, independently) is set via the dashboard UI / POST
# /api/dashboard/capital, and persists day to day automatically once set.
# Set conservatively here: if either strategy is ever touched before
# you've set its real value via UI, the fallback applies PER STRATEGY
# independently, so keep this at or below (your total budget / 2) to
# avoid both strategies defaulting to more than your account holds.
#
# trading.risk-per-trade, max-position-pct, trade-window-start/end,
# exit-on-market-turn, exit-on-sector-turn — REMOVED from this file.
# None of these are read by AI or News: both use hardcoded 1% risk
# constants, their own internal trade-window logic, and (for News)
# market/sector-turn exits were explicitly removed by request — these
# keys only ever applied to PaperTradeManagementService and the other
# strategies being deleted (SCPS/HighRR/ORB/SMC/etc).
trading:
  mode: ${TRADING_MODE:LIVE}
  capital: ${TRADING_CAPITAL:5000}
  skip-trail-on-momentum: true

# ================================
# PAPER TRADING
# ================================
paper-trading:
  initial-capital: ${PAPER_CAPITAL:${TRADING_CAPITAL:5000}}
  sl-slip-pct: 0.001
  target-slip-pct: 0.0005
  eod-slip-pct: 0.0015
  brokerage: 40.0

# ================================
# RISK CONTROL — still read by CircuitBreakerService, which AI/News
# both depend on for the daily/weekly/monthly drawdown permission check.
# ================================
circuit-breaker:
  max-trades-per-day: 10
  daily-loss-cap-pct: -3.5
  weekly-drawdown-cap-pct: -8.0
  monthly-drawdown-cap-pct: -15.0
  profit-lock-trigger-pct: 6.0
  profit-floor-pct: 4.0
  giveback-multiplier: 2.0
  min-giveback-pct: 0.5

# ================================
# MARKET FILTERS — vix.* read by VixService (used by AI/News for regime
# context); market.*/sector.*/scanner.* kept as-is, unchanged from before.
# ================================
scanner:
  min-volume: 250000
  min-price: 100
  bb-width-max: 3.0
  max-sl-pct: 2.5
  cooldown-seconds: 2400
  retest-tolerance: 0.005
  min-gap-pct: 0.3
  entry-mode: ${ENTRY_MODE:AGGRESSIVE}

market:
  atr-min-pct: 0.2
  atr-max-pct: 3.0
  trend-candles: 8
  doji-body-pct: 0.10

vix:
  normal-max: 20.0
  extreme-min: 28.0
  block-trades-when-extreme: false

sector:
  min-aligned-pct: 55
  min-relative-strength: 0.8

# ================================
# STRATEGIES
#
# CLEANUP: removed the config blocks for smart-channel-pullback,
# sideways-scalp, high-rr, market-pressure, orb, best-trade, smc, and the
# shared strategy.global/strategy.rvol blocks. Confirmed: none of these
# keys are read by anything in the AI or News module — they were only
# ever consumed by PaperTradeManagementService and the strategy classes
# now being permanently deleted (HighRR/SCPS/Sideways/MarketPressure/
# ORB-engine/BestTrade/SMC). Only strategy.news remains, since News stays.
#
# IMPORTANT: strategy.high-rr.enabled and strategy.smc.enabled previously
# defaulted to TRUE in this file — meaning HighRR and SMC would have been
# ACTIVE in LIVE mode tomorrow even though every other strategy was
# correctly disabled. That was the most urgent fix in this revision.
# ================================
strategy:
  enabled: true

  news:
    enabled: ${NEWS_ENABLED:true}
    min-score: 75
    max-signals-per-session: 2
    gnews-key: ${GNEWS_KEY:}
    time-stop-minutes: 0   # No time-stop — exit only on SL or target

# ================================
# AI TRADING MODULE
#
# FIX (critical): was ${AI_TRADING_ENABLED:false} — every AI bean is
# gated by @ConditionalOnProperty(ai.trading.enabled=true), so AI would
# not have started at all tomorrow unless AI_TRADING_ENABLED was
# explicitly set as an environment variable. Default changed to true
# here so AI runs correctly even if that env var is never set —
# explicitly setting AI_TRADING_ENABLED=false is now required to turn
# AI off, the safer default direction given you're going live with AI
# specifically tomorrow.
# ================================
# ================================
# MANUAL SWING TRADING MODULE
# Completely independent module — manual CNC swing trades initiated from
# the UI. Zero shared config keys with AI/News; own dedicated namespace.
# ================================
manual-swing:
  profit-target-pct: 5.0           # quick-exit threshold, see service docstring
  force-exit-time: "09:20"         # unconditional exit time, day after purchase
  market-open-time: "09:15"
  market-close-time: "15:30"
  monitoring-interval-ms: 60000    # scheduler tick — 1 min, swing-trade granularity
  order-poll-interval-ms: 3000     # fill-confirmation poll, same cadence as rest of app
  order-poll-max-attempts: 10

  # ── Auto Stock Selection & Auto Buy (small-cap focused) — DISABLED by
  # default. Per spec: scans full NSE+BSE universe, ranks sectors (Rule 1),
  # qualifies them against daily/weekly/monthly/yearly thresholds (Rule 2),
  # applies mandatory momentum (Rule 3) and promoter-holding (Rule 4)
  # gates, scores survivors by fundamentals, buys the highest-confidence
  # pick at 3pm with fixed capital — ONLY if no manual trade exists today.
  auto-trade-enabled: false
  auto-trade-check-time: "15:00"
  auto-trade-capital: 10000
  backfill-target-days: 252
  backfill-delay-ms: 2000
  top-sectors-to-evaluate: 4
  sector-daily-min-pct: 5.0
  sector-daily-max-pct: 6.0
  sector-weekly-min-pct: 15.0
  sector-monthly-over-weekly-margin-pct: 5.0
  sector-yearly-min-pct: 60.0
  min-promoter-holding-pct: 60.0

ai:
  trading:
    enabled: ${AI_TRADING_ENABLED:true}
    max-trades-per-day: 5
    max-concurrent: 2
    min-confidence: 0.60
    min-rr: 2.0
    ranking-top-n: 20
    risk-per-trade: 0.01
    scanner-enabled: true

# ================================
# WARMUP CONFIG
# ================================
warmup:
  redis-enabled: ${WARMUP_REDIS_ENABLED:true}
  broker-fetch-threads: 20

# ================================
# NOTIFICATIONS
# ================================
notifications:
  telegram:
    enabled: false
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}

# ================================
# SERVER
# ================================
server:
  port: 8081

# ================================
# ACTUATOR
# ================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /internal/actuator
  endpoint:
    health:
      show-details: when-authorized

# ================================
# RESILIENCE
# ================================
resilience4j:
  retry:
    instances:
      zerodha-api:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2.0

app:
  allowed-origins: http://localhost:8081,http://127.0.0.1:8081

# ================================
# LOGGING
# ================================
logging:
  level:
    root: INFO
    com.trading: DEBUG
    com.zerodhatech: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN

  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

  file:
    name: logs/trading-platform.log

  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
      file-name-pattern: logs/trading-platform.%d{yyyy-MM-dd}.%i.log