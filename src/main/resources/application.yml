spring:
  application:
    name: trading-platform

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  session:
    timeout: 28800

  task:
    execution:
      pool:
        core-size: 16
        max-size: 64
        queue-capacity: 10000
        keep-alive: 60s
      thread-name-prefix: trading-

dashboard:
  username: ${DASHBOARD_USERNAME:admin}
  password: ${DASHBOARD_PASSWORD:changeme}
  remember-me-key: ${REMEMBER_ME_KEY:trading-platform-secret-2024}

# ================================
# ZERODHA CONFIG
# ================================
zerodha:
  api-key: ${ZERODHA_API_KEY}
  api-secret: ${ZERODHA_API_SECRET}
  user-id: ${ZERODHA_USER_ID}
  account-id: ${ZERODHA_ACCOUNT_ID}
  password: ${ZERODHA_PASSWORD}
  totp-secret: ${ZERODHA_TOTP_SECRET:}
  redirect-url: ${ZERODHA_REDIRECT_URL:http://localhost:8081/api/auth/callback}
  auto-login: true
  websocket:
    max-reconnects: 20
    reconnect-delay-ms: 5000

# ================================
# TRADING CORE
# ================================
trading:
  mode: ${TRADING_MODE:PAPER}
  capital: ${TRADING_CAPITAL:100000}
  risk-per-trade: 0.01
  max-position-pct: 0.20
  trade-window-start: "09:30"
  trade-window-end: "14:40"
  entry-mode: ${ENTRY_MODE:AGGRESSIVE}
  strong-trend-risk: 0.01
  moderate-trend-risk: 0.005
  skip-trail-on-momentum: true
  exit-on-market-turn: true
  exit-on-sector-turn: true
  max-phase1-concurrent: 3

# ================================
# PAPER TRADING
# ================================
paper-trading:
  initial-capital: ${PAPER_CAPITAL:${TRADING_CAPITAL:100000}}
  sl-slip-pct: 0.001
  target-slip-pct: 0.0005
  eod-slip-pct: 0.0015
  brokerage: 40.0

# ================================
# RISK CONTROL
# ================================
circuit-breaker:
  max-trades-per-day: 10
  daily-loss-cap-pct: -3.5
  weekly-drawdown-cap-pct: -8.0
  monthly-drawdown-cap-pct: -15.0
  profit-lock-trigger-pct: 6.0
  profit-floor-pct: 4.0
  giveback-multiplier: 2.0
  min-giveback-pct: 0.5

# ================================
# MARKET FILTERS
# ================================
scanner:
  min-volume: 250000
  min-price: 100
  bb-width-max: 3.0
  max-sl-pct: 2.5
  cooldown-seconds: 2400
  retest-tolerance: 0.005
  min-gap-pct: 0.3
  entry-mode: ${ENTRY_MODE:AGGRESSIVE}

market:
  atr-min-pct: 0.3
  atr-max-pct: 3.0
  trend-candles: 8
  doji-body-pct: 0.10

vix:
  normal-max: 20.0
  extreme-min: 28.0
  block-trades-when-extreme: false

sector:
  min-aligned-pct: 55
  min-relative-strength: 0.8

# ================================
# STRATEGIES (MERGED CLEANLY)
# ================================
strategy:
  enabled: true

  global:
    gravity-exhaustion-pct: 1.5
    poc-proximity-pct: 1.0
    rvol-time-slot-enabled: true
    min-rvol-trend: 1.3
    min-rvol-reversal: 1.2
    min-rvol-impulse: 1.5
    breakeven-r-trigger: 1.5
    partial-exit-r: 3.0
    trailing-mode: CANDLE_LOW
    global-time-stop: 30m
    trend-trail-trigger-r: 2.0

  rvol:
    history-days: 5
    slot-minutes: 5
    min-rvol-for-impulse: 1.5
    min-rvol-for-signal: 1.3
    min-rvol-for-spring: 1.2

  # ================================
  # SMART CHANNEL PULLBACK
  # ================================
  smart-channel-pullback:
    enabled: ${SCPS_ENABLED:true}
    require-high-quality-channel: false
    time-stop-minutes: 60
    # FIX: was 1.0 (average RVOL = no conviction). Internal floor is 1.1.
    min-rvol: 1.0
    max-signals-per-session: 3
    # FIX: sector must be strictly positive for BUY, strictly negative for SELL
    sector-buy-threshold: 0.05
    sector-sell-threshold: -0.05
    min-adjusted-rr: 1.8
    symbol-cooldown-minutes: 60
    max-channel-width-pct: 5.0
    t1-rr: 2.0
    t2-rr: 3.0
    # FIX: Pullback zone factor (FIX 1): 0.50 = lower 50% of channel accepted
    # (was 0.30 — too narrow, caused 0 signals on momentum days)
    pb-zone-factor: 0.50
    # FIX: Minimum SL distance % (FIX 4)
    min-sl-pct: 0.004
    # FIX: Minimum stock price (FIX 2)
    min-stock-price: 100

  # ================================
  # SIDEWAYS SCALP
  # ================================
  sideways-scalp:
    enabled: ${SCALP_ENABLED:true}
    min-rvol: 1.1
    max-signals-per-session: 5
    time-stop-minutes: 20
    # FIX: Strong pressure bypass ratio (see SidewaysScalpStrategy FIX 1)
    # When market pressure ratio >= this value, strict hammer/shooting-star
    # pattern is relaxed to any bullish/bearish candle direction.
    strong-pressure-bypass-ratio: 1.50
    # FIX: Minimum SL distance as % of entry price (FIX 3)
    min-sl-pct: 0.0035
    # FIX: Minimum stock price filter (FIX 2)
    min-stock-price: 100

  # ================================
  # HIGH RR INTRADAY STRATEGY
  # FIX: was incorrectly nested under sideways-scalp due to bad indentation.
  # Must be a sibling block at the same level as smart-channel-pullback.
  # ================================
  high-rr:
    enabled: ${HIGHRR_ENABLED:true}
    time-stop-minutes: 90
    risk-per-trade: 0.01

  # ================================
  # MARKET PRESSURE STRATEGY
  # ================================
  market-pressure:
    enabled: ${PRESSURE_ENABLED:true}
    time-stop-minutes: 30
    max-signals-per-session: 6

  # ================================
  # ORB (OPENING RANGE BREAKOUT) STRATEGY
  # Added: was previously missing, causing @Value defaults to be used silently.
  # Explicitly declared here for visibility and easy tuning.
  # ================================
  orb:
    enabled: ${ORB_ENABLED:true}
    # Reward:risk multiplier for T1 target.
    # T1 = entry ± (orbRange × target-rr)
    # T2 = entry ± (orbRange × target-rr × 1.5)
    target-rr: 1.5
    # Auto-cancel breakout watch if no breakout by 11:30 AM.
    # Time-stop for active trades: 120 minutes from entry (≈ 1:30 PM exit).
    # Note: forced exit at 1:30 PM is also enforced by HighRROrderExecutionService
    # scheduler. The time-stop-minutes here governs PaperTradeManagementService
    # tick-level exit, providing a second line of defence.
    time-stop-minutes: 120
    # GAP FIX 1: Minimum traded volume at 9:15 for a stock to qualify for ORB tracking.
    # Stocks below this volume threshold are pre-filtered before entering the ORB pipeline.
    # This prevents illiquid stocks (wide spreads, unreliable price discovery) from
    # being tracked. Adjust based on your universe (Nifty 100 vs Nifty 500).
    # 100,000 = conservative (works well for Nifty 100 stocks)
    # 50,000  = wider net (includes mid-cap stocks)
    min-premarket-volume: 100000

# ================================
# WARMUP CONFIG
# ================================
warmup:
  redis-enabled: ${WARMUP_REDIS_ENABLED:true}
  broker-fetch-threads: 20

# ================================
# NOTIFICATIONS
# ================================
notifications:
  telegram:
    enabled: false
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}

# ================================
# SERVER
# ================================
server:
  port: 8081

# ================================
# ACTUATOR
# ================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /internal/actuator
  endpoint:
    health:
      show-details: when-authorized

# ================================
# RESILIENCE
# ================================
resilience4j:
  retry:
    instances:
      zerodha-api:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2.0

app:
  allowed-origins: http://localhost:8081,http://127.0.0.1:8081

# ================================
# LOGGING
# ================================
logging:
  level:
    root: INFO
    com.trading: TRACE
    com.zerodhatech: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN

  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

  file:
    name: logs/trading-platform.log

  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
      file-name-pattern: logs/trading-platform.%d{yyyy-MM-dd}.%i.log