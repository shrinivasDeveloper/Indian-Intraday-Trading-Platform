spring:
  application:
    name: trading-platform
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  session:
    timeout: 28800
  task:
    execution:
      pool:
        core-size: 16
        max-size: 64
        queue-capacity: 10000
        keep-alive: 60s
      thread-name-prefix: trading-

dashboard:
  username: ${DASHBOARD_USERNAME:admin}
  password: ${DASHBOARD_PASSWORD:changeme}
  remember-me-key: ${REMEMBER_ME_KEY:trading-platform-secret-2024}

# ================================
# ZERODHA CONFIG
# ================================
zerodha:
  api-key: ${ZERODHA_API_KEY}
  api-secret: ${ZERODHA_API_SECRET}
  user-id: ${ZERODHA_USER_ID}
  account-id: ${ZERODHA_ACCOUNT_ID}
  password: ${ZERODHA_PASSWORD}
  totp-secret: ${ZERODHA_TOTP_SECRET:}
  redirect-url: ${ZERODHA_REDIRECT_URL:http://localhost:8081/api/auth/callback}
  auto-login: true
  websocket:
    max-reconnects: 20
    reconnect-delay-ms: 5000

# ================================
# TRADING CORE
# ================================
trading:
  mode: ${TRADING_MODE:PAPER}
  capital: ${TRADING_CAPITAL:100000}
  risk-per-trade: 0.01
  max-position-pct: 0.20
  trade-window-start: "09:30"
  trade-window-end: "14:40"
  entry-mode: ${ENTRY_MODE:AGGRESSIVE}
  strong-trend-risk: 0.01
  moderate-trend-risk: 0.005
  skip-trail-on-momentum: true
  exit-on-market-turn: true
  exit-on-sector-turn: true

  # ── 10-2-3 Slot Manager ──────────────────────────────────────────────
  max-trades-per-strategy: 2
  max-phase1-concurrent: 3
  max-sector-trades: 2

  # ── FLAW 3 FIX: Stale Signal Guard ───────────────────────────────────
  # Signals older than this many seconds are rejected at Gate-0.
  # 30s = realistic queue delay budget for the @Async trading executor.
  # Increase to 60s if signals are legitimately slower (e.g. heavy load days).
  max-signal-age-seconds: 30

# ================================
# PAPER TRADING
# ================================
paper-trading:
  initial-capital: ${PAPER_CAPITAL:${TRADING_CAPITAL:100000}}
  entry-slip-pct: 0.0005        # Legacy flat slip — overridden by impact cost below
  sl-slip-pct: 0.001
  target-slip-pct: 0.0005
  eod-slip-pct: 0.0015
  brokerage: 40.0

  # ── FLAW 2 FIX: Dynamic Impact Cost (replaces flat entry-slip-pct) ───
  # Formula: slipPct = base + (atr-weight × atr%) + (vol-weight × (avgVol/curVol - 1))
  # Clamped to [min-slip, max-slip]
  #
  # Calibration guide:
  #   base:       3 bps  (minimum for any market order, even Nifty50 liquid stocks)
  #   atr-weight: 0.15   (15% of ATR% = intraday range contribution to impact)
  #   vol-weight: 0.001  (0.1% per unit of volume scarcity beyond normal)
  #   min-slip:   0.0003 (3 bps  — Nifty50 + high ADV, normal session)
  #   max-slip:   0.005  (50 bps — illiquid mid-cap, thin book, high-ATR session)
  #
  # Example results:
  #   RELIANCE (ATR%=0.8%, vol=2×avg):   0.03% + 0.12% + 0    = 0.15%
  #   Mid-cap  (ATR%=2.5%, vol=0.3×avg): 0.03% + 0.375%+ 0.07%= 0.475%
  #   Illiquid (ATR%=4.0%, vol=0.1×avg): 0.03% + 0.6%  + 0.09%= 0.72% → capped 0.5%
  impact-cost:
    base: 0.0003
    atr-weight: 0.15
    vol-weight: 0.001
    min-slip: 0.0003
    max-slip: 0.005

# ================================
# RISK CONTROL
# ================================
circuit-breaker:
  # 10-2-3 Slot Manager: max 10 trades per day
  max-trades-per-day: 10

  # FLAW hard-kill at -2.5% (REQ 2a) — triggers immediate CLOSE_ALL
  daily-loss-cap-pct: -2.5
  weekly-drawdown-cap-pct: -8.0
  monthly-drawdown-cap-pct: -15.0

  # ── FLAW 5 FIX: Dynamic Trailing Profit Floor ─────────────────────────
  # Activates profit lock when daily P&L reaches +6%.
  profit-lock-trigger-pct: 6.0

  # Static minimum floor — trailing floor never drops below this.
  # Even on the most volatile day, +4% is the guaranteed minimum.
  profit-floor-pct: 4.0

  # Give-back multiplier: dynamicGiveBack = dailyVol × giveback-multiplier
  # dailyVol = VIX / sqrt(252) / 100 × 100  (VIX as %, converted to daily %)
  # VIX=15 → dailyVol≈0.94% → giveBack=max(0.5, 0.94×2)=1.88%
  # VIX=25 → dailyVol≈1.57% → giveBack=max(0.5, 1.57×2)=3.14%
  giveback-multiplier: 2.0

  # Minimum give-back regardless of VIX — prevents unrealistically tight floor
  # on ultra-calm days (VIX < 8). 0.5% = 50 bps minimum trailing window.
  min-giveback-pct: 0.5

# ================================
# MARKET FILTERS
# ================================
scanner:
  min-volume: 300000
  min-price: 50
  bb-width-max: 3.0
  max-sl-pct: 2.5
  cooldown-seconds: 1800
  retest-tolerance: 0.005
  min-gap-pct: 0.3
  entry-mode: ${ENTRY_MODE:AGGRESSIVE}

market:
  atr-min-pct: 0.3
  atr-max-pct: 3.0
  trend-candles: 8
  doji-body-pct: 0.10

vix:
  normal-max: 20.0
  extreme-min: 28.0
  block-trades-when-extreme: false

sector:
  min-aligned-pct: 55
  min-relative-strength: 0.8

# ================================
# STRATEGY
# ================================
strategy:
  enabled: true
  global:
    gravity-exhaustion-pct: 1.5
    poc-proximity-pct: 1.0
    rvol-time-slot-enabled: true
    min-rvol-trend: 1.3
    min-rvol-reversal: 1.2
    min-rvol-impulse: 1.5
    breakeven-r-trigger: 1.5
    partial-exit-r: 3.0
    trailing-mode: CANDLE_LOW
    global-time-stop: 30m
  auto-mode:
    sector-move-min-pct: 0.5
    reversal-gain-min-pct: 2.8
    range-sector-max-pct: 0.3
    wick-ratio-min: 0.6
    range-breakout-volume: 2.0
    trend-rr: 2.5
    reversal-rr: 2.0
    range-rr: 1.5
    trend-trail-trigger-r: 2.0
    reversal-time-stop: 45m
  range-breakout:
    min-touches: 2
    touch-tolerance-pct: 0.2
    volume-breakout-multiplier: 1.5
    body-ratio-min: 0.5
    consolidation-candles: 16
    max-range-pct: 4.0
    rr: 2.0
    entry-start: "09:45"
    entry-end: "12:00"
    spring-enabled: true
    spring-max-depth-pct: 0.6
    spring-recovery-candles: 2
    spring-score: 95.0
    normal-breakout-score: 80.0
    poc-sl-buffer: 0.0005
    trail-trigger-r: 1.5
    time-stop: 30m
    min-rvol-breakout: 1.4
    min-rvol-spring: 1.2
    vah-proximity-pct: 0.5
  orb:
    nifty-min-change-pct: 0.2
    sector-min-change-pct: 0.3
    volume-min-multiplier: 1.2
    retest-tolerance-pct: 0.5
    body-ratio-min: 0.50
    wick-ratio-max: 0.40
    rr: 2.0
    entry-start: "09:30"
    entry-end: "13:00"
    orb-candles: 3
  pullback:
    impulse-min-pct: 1.5
    min-rvol-impulse: 1.5
    min-rsi-impulse: 65.0
    pullback-vol-ratio: 0.7
    rr: 3.0
    poc-sl-buffer: 0.0005
    entry-start: "09:45"
    entry-end: "14:00"
    state-ttl-minutes: 45
    time-stop: 30m
  rvol:
    history-days: 5
    slot-minutes: 5
    min-rvol-for-impulse: 1.5
    min-rvol-for-signal: 1.3
    min-rvol-for-spring: 1.2

# ================================
# NOTIFICATIONS
# ================================
notifications:
  telegram:
    enabled: false
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /internal/actuator
  endpoint:
    health:
      show-details: when-authorized

resilience4j:
  retry:
    instances:
      zerodha-api:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2.0

app:
  allowed-origins: http://localhost:8081,http://127.0.0.1:8081

logging:
  level:
    com.trading: INFO
    com.zerodhatech: WARN
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/trading-platform.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
      file-name-pattern: logs/trading-platform.%d{yyyy-MM-dd}.%i.log`Z
