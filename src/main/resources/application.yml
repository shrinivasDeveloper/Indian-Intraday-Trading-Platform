spring:
  application:
    name: trading-platform

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  session:
    timeout: 28800

  task:
    execution:
      pool:
        core-size: 16
        max-size: 64
        queue-capacity: 10000
        keep-alive: 60s
      thread-name-prefix: trading-

dashboard:
  username: ${DASHBOARD_USERNAME:admin}
  password: ${DASHBOARD_PASSWORD:changeme}
  remember-me-key: ${REMEMBER_ME_KEY:trading-platform-secret-2024}

# ================================
# ZERODHA CONFIG
# ================================
zerodha:
  api-key: ${ZERODHA_API_KEY}
  api-secret: ${ZERODHA_API_SECRET}
  user-id: ${ZERODHA_USER_ID}
  account-id: ${ZERODHA_ACCOUNT_ID}
  password: ${ZERODHA_PASSWORD}
  totp-secret: ${ZERODHA_TOTP_SECRET:}
  redirect-url: ${ZERODHA_REDIRECT_URL:http://localhost:8081/api/auth/callback}
  auto-login: true
  websocket:
    max-reconnects: 20
    reconnect-delay-ms: 5000

# FIX: Zerodha now requires order-placement requests to originate from a
# whitelisted, STABLE IP ("403: No IPs configured for this app"). Railway's
# default outbound IP is dynamic. Routes KiteConnect through a static-IP
# proxy (e.g. staticip.in) instead - that proxy's IP is what gets
# whitelisted on Kite Developer Console, not Railway's own IP.
# Disabled by default (proxyEnabled=false) - zero effect on local
# development, where your own IP is already stable and whitelisted.
# NOTE: local relay port (127.0.0.1:18899) is hardcoded in
# LocalProxyRelay.java, not configurable here - confirmed this is the
# correct, simpler version after reverting an earlier attempt to make
# it configurable (the actual port conflict that prompted that attempt
# was a leftover OS process, not a real code need for configurability).
kite:
  proxy:
    enabled: ${KITE_PROXY_ENABLED:false}
    host: ${KITE_PROXY_HOST:}
    port: ${KITE_PROXY_PORT:0}
    username: ${KITE_PROXY_USERNAME:}
    password: ${KITE_PROXY_PASSWORD:}

# ================================
# TRADING CORE
# ================================
# NOTE: trading.capital is now only a FALLBACK — real per-strategy capital
# (AI vs News, independently) is set via the dashboard UI / POST
# /api/dashboard/capital, and persists day to day automatically once set.
# Set conservatively here: if either strategy is ever touched before
# you've set its real value via UI, the fallback applies PER STRATEGY
# independently, so keep this at or below (your total budget / 2) to
# avoid both strategies defaulting to more than your account holds.
#
# trading.risk-per-trade, max-position-pct, trade-window-start/end,
# exit-on-market-turn, exit-on-sector-turn — REMOVED from this file.
# None of these are read by AI or News: both use hardcoded 1% risk
# constants, their own internal trade-window logic, and (for News)
# market/sector-turn exits were explicitly removed by request — these
# keys only ever applied to PaperTradeManagementService and the other
# strategies being deleted (SCPS/HighRR/ORB/SMC/etc).
trading:
  mode: ${TRADING_MODE:LIVE}
  capital: ${TRADING_CAPITAL:5000}
  skip-trail-on-momentum: true

# ================================
# PAPER TRADING
# ================================
paper-trading:
  initial-capital: ${PAPER_CAPITAL:${TRADING_CAPITAL:5000}}
  sl-slip-pct: 0.001
  target-slip-pct: 0.0005
  eod-slip-pct: 0.0015
  brokerage: 40.0

# ================================
# RISK CONTROL — still read by CircuitBreakerService, which AI/News
# both depend on for the daily/weekly/monthly drawdown permission check.
#
# NOTE: this is entirely SEPARATE from AccountMarginGuard (a newer,
# genuinely shared cross-strategy safeguard added during a full
# platform production-readiness review — checks REAL live Zerodha
# account margin before each order, no config needed, always active
# once its bean is wired in). CircuitBreakerService below governs
# drawdown/loss limits; AccountMarginGuard governs whether the account
# can literally afford one more order right now. Both matter, neither
# replaces the other.
# ================================
circuit-breaker:
  max-trades-per-day: 10
  daily-loss-cap-pct: -3.5
  weekly-drawdown-cap-pct: -8.0
  monthly-drawdown-cap-pct: -15.0
  profit-lock-trigger-pct: 6.0
  profit-floor-pct: 4.0
  giveback-multiplier: 2.0
  min-giveback-pct: 0.5

# ================================
# MARKET FILTERS — vix.* read by VixService (used by AI/News for regime
# context); market.*/sector.*/scanner.* kept as-is, unchanged from before.
# ================================
scanner:
  min-volume: 250000
  min-price: 100
  bb-width-max: 3.0
  max-sl-pct: 2.5
  cooldown-seconds: 2400
  retest-tolerance: 0.005
  min-gap-pct: 0.3
  entry-mode: ${ENTRY_MODE:AGGRESSIVE}

market:
  atr-min-pct: 0.2
  atr-max-pct: 3.0
  trend-candles: 8
  doji-body-pct: 0.10

vix:
  normal-max: 20.0
  extreme-min: 28.0
  block-trades-when-extreme: false

sector:
  min-aligned-pct: 55
  min-relative-strength: 0.8

# ================================
# STRATEGIES
#
# CLEANUP: removed the config blocks for smart-channel-pullback,
# sideways-scalp, high-rr, market-pressure, orb, best-trade, smc, and the
# shared strategy.global/strategy.rvol blocks. Confirmed: none of these
# keys are read by anything in the AI or News module — they were only
# ever consumed by PaperTradeManagementService and the strategy classes
# now being permanently deleted (HighRR/SCPS/Sideways/MarketPressure/
# ORB-engine/BestTrade/SMC). Only strategy.news remains, since News stays.
#
# IMPORTANT: strategy.high-rr.enabled and strategy.smc.enabled previously
# defaulted to TRUE in this file — meaning HighRR and SMC would have been
# ACTIVE in LIVE mode tomorrow even though every other strategy was
# correctly disabled. That was the most urgent fix in this revision.
# ================================
strategy:
  enabled: true

  news:
    enabled: ${NEWS_ENABLED:true}
    min-score: 75
    max-signals-per-session: 2
    gnews-key: ${GNEWS_KEY:}
    time-stop-minutes: 0   # No time-stop — exit only on SL or target

# ================================
# AI TRADING MODULE
#
# FIX (critical): was ${AI_TRADING_ENABLED:false} — every AI bean is
# gated by @ConditionalOnProperty(ai.trading.enabled=true), so AI would
# not have started at all tomorrow unless AI_TRADING_ENABLED was
# explicitly set as an environment variable. Default changed to true
# here so AI runs correctly even if that env var is never set —
# explicitly setting AI_TRADING_ENABLED=false is now required to turn
# AI off, the safer default direction given you're going live with AI
# specifically tomorrow.
#
# threshold correction (this revision): TRENDING/RANGING execution
# thresholds unified to a single 80-point minimum in code
# (AiTradingSystem.java) after the old ">1.5% extended" hard-lock gate
# was removed per explicit instruction - min-confidence/min-rr below
# are unrelated, separate gates and are unchanged.
ai:
  trading:
    enabled: ${AI_TRADING_ENABLED:true}
    max-trades-per-day: 2
    max-concurrent: 2
    min-confidence: 0.60
    min-rr: 2.0
    ranking-top-n: 20
    risk-per-trade: 0.01
    scanner-enabled: true

# ================================
# MANUAL SWING TRADING MODULE
# Completely independent module — manual CNC swing trades initiated from
# the UI. Zero shared config keys with AI/News; own dedicated namespace.
# ================================
manual-swing:
  profit-target-pct: 5.0           # quick-exit threshold, see service docstring
  force-exit-time: "09:20"         # unconditional exit time, day after purchase
  market-open-time: "09:15"
  market-close-time: "15:30"
  monitoring-interval-ms: 60000    # scheduler tick — 1 min, swing-trade granularity
  order-poll-interval-ms: 3000     # fill-confirmation poll, same cadence as rest of app
  order-poll-max-attempts: 10

  # ── Auto Stock Selection & Auto Buy — DISABLED by default.
  #
  # CORRECTED THIS REVISION (per explicit spec correction - the earlier
  # implementation had genuinely conflated sector-level and stock-level
  # qualification):
  #   "Sector Strength" (Rule 1) — REMOVED ENTIRELY per later explicit
  #     instruction ("remove sector field put only stock filter for all
  #     nse bse stock"). Every NSE+BSE equity stock is now evaluated
  #     directly, with zero sector grouping/ranking/gating of any kind.
  #     top-sectors-to-evaluate's old meaning is gone entirely.
  #   "Stock Qualification" — now the ONLY qualification concept, checked
  #     per INDIVIDUAL STOCK (not a sector average): daily 4-6%, weekly
  #     >=15%, monthly >= weekly+5%, AND a NEW yearly >=70% gate added
  #     later this revision (stock-yearly-min-pct is REPURPOSED for this
  #     stock-level check now, not removed - just means something
  #     different than its original sector-level intent).
  #   "Stock Momentum" (mandatory) — current-month higher-highs + no
  #     significant breakdown - UNCHANGED throughout every correction,
  #     confirmed byte-identical each time.
  #   Cooling period — CORRECTED from 10 to 15 trading days per explicit
  #     instruction ("last 15 days dont take trade").
  #
  # REMOVED (confirmed dead, zero remaining references anywhere):
  #   top-sectors-to-evaluate — sector walking no longer exists at all
  #   min-promoter-holding-pct — Rule 4/fundamentals removed entirely
  #     earlier this revision (Yahoo Finance dependency also removed)
  auto-trade-enabled: true
  auto-trade-check-time: "15:00"
  auto-trade-capital: 10000
  backfill-target-days: 252
  backfill-delay-ms: 2000
  stock-daily-min-pct: 4.0    # CORRECTED from 5.0 - spec says "4-6% only"
  stock-daily-max-pct: 6.0
  stock-weekly-min-pct: 15.0
  stock-monthly-over-weekly-margin-pct: 5.0
  stock-yearly-min-pct: 70.0  # REPURPOSED: was sector-level 60%, now the
    # NEW stock-level yearly gate at 70%, added
  # per explicit instruction this revision
momentum-stock-of-day:
  enabled: true         # keep false until you've watched a live day first
  selection-time: "09:30"
  top-sectors-count: 2
  top-stocks-per-sector: 3
  capital: 10000.0
  min-consolidation-candles: 2
  max-consolidation-candles: 8
  candle-interval: "5minute"
  max-candle-body-pct: 0.003
  volatility-reject-multiple: 2.0
  risk-reward-ratio: 1.5
  max-trades-per-day: 2
  trailing-stop-consolidation-range-multiple: 0.5
  monitoring-interval-ms: 60000
  force-exit-time: "15:15"
  order-poll-interval-ms: 3000
  order-poll-max-attempts: 10
  pullback-enabled: true
  pullback-log-only: false
# ================================
# HERO OR ZERO — MONTHLY EXPIRY OPTIONS STRATEGY
#
# NEW THIS REVISION: completely independent module (own controller,
# service, scheduler, repository, entity, config, exception - zero
# shared business logic with AI/News/Swing, confirmed by direct source
# search). Trades ONE CE + ONE PE per index, ONLY on that index's real
# Monthly Expiry day (automatically holiday-shifted per NSE/BSE rules),
# entry at entry-time, MANDATORY exit at exit-time regardless of P&L.
#
# DISABLED BY DEFAULT (enabled=false) — this places real, undefined-
# max-loss-until-decided option market orders automatically once
# enabled. Confirmed from your own startup logs every time so far:
# "[HERO-ZERO] Strategy disabled (hero-zero.enabled=false) - scheduler
# idle." Must be explicitly turned on when you're ready to go live.
#
# HONEST CAVEAT (stated in code, repeated here): expiry-weekday
# assignments below and the holiday calendar used internally
# (HeroZeroHolidayChecker, a SEPARATE, independent copy from Swing's
# own MarketHolidayChecker) were compiled from public sources, NOT
# verified against NSE/BSE's own official JS-rendered calendar
# directly. Verify both before trusting this with real capital.
# ================================
hero-zero:
  enabled: ${HERO_ZERO_ENABLED:false}
  entry-time: "14:30"
  exit-time: "15:10"
  strike-selection-start-time: "14:25"
  quantity-lots: 1
  min-liquidity-volume: 500
  order-poll-max-attempts: 10
  order-poll-interval-ms: 3000
  target-premium:
    NIFTY: 15
    BANKNIFTY: 25
    FINNIFTY: 15
    MIDCPNIFTY: 5
    SENSEX: 30
  # 1=Monday ... 7=Sunday (ISO-8601) — VERIFY against NSE/BSE's current
  # circular before trusting these, per the honest caveat above.
  expiry-weekday:
    NIFTY: 2
    BANKNIFTY: 4
    FINNIFTY: 2
    MIDCPNIFTY: 5
    SENSEX: 5

# ================================
# WARMUP CONFIG
# ================================
warmup:
  redis-enabled: ${WARMUP_REDIS_ENABLED:true}
  broker-fetch-threads: 20

# ================================
# NOTIFICATIONS
# ================================
notifications:
  telegram:
    enabled: false
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}

# ================================
# SERVER
# ================================
server:
  port: ${PORT:8082}

# ================================
# ACTUATOR
# ================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /internal/actuator
  endpoint:
    health:
      show-details: when-authorized

# ================================
# RESILIENCE
# ================================
resilience4j:
  retry:
    instances:
      zerodha-api:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2.0

app:
  allowed-origins: http://localhost:8081,http://127.0.0.1:8081

# ================================
# LOGGING
# ================================
logging:
  level:
    root: INFO
    com.trading: DEBUG
    com.zerodhatech: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN

  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

  file:
    name: logs/trading-platform.log

  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
      file-name-pattern: logs/trading-platform.%d{yyyy-MM-dd}.%i.log