spring:
  application:
    name: trading-platform
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  session:
    timeout: 28800
  task:
    execution:
      pool:
        core-size: 16
        max-size: 64
        queue-capacity: 10000
        keep-alive: 60s
      thread-name-prefix: trading-

dashboard:
  username: ${DASHBOARD_USERNAME:admin}
  password: ${DASHBOARD_PASSWORD:changeme}
  remember-me-key: ${REMEMBER_ME_KEY:trading-platform-secret-2024}

# ================================
# ZERODHA CONFIG
# ================================
zerodha:
  api-key: ${ZERODHA_API_KEY}
  api-secret: ${ZERODHA_API_SECRET}
  user-id: ${ZERODHA_USER_ID}
  account-id: ${ZERODHA_ACCOUNT_ID}
  password: ${ZERODHA_PASSWORD}
  totp-secret: ${ZERODHA_TOTP_SECRET:}
  redirect-url: ${ZERODHA_REDIRECT_URL:http://localhost:8081/api/auth/callback}
  auto-login: true
  websocket:
    max-reconnects: 20
    reconnect-delay-ms: 5000

# ================================
# TRADING CORE
# ================================
trading:
  mode: ${TRADING_MODE:PAPER}
  capital: ${TRADING_CAPITAL:100000}
  risk-per-trade: 0.01
  max-position-pct: 0.20
  trade-window-start: "09:30"
  trade-window-end: "14:40"
  entry-mode: ${ENTRY_MODE:AGGRESSIVE}
  strong-trend-risk: 0.01
  moderate-trend-risk: 0.005
  skip-trail-on-momentum: true
  exit-on-market-turn: true
  exit-on-sector-turn: true

  # ── 10-2-3 Slot Manager ──────────────────────────────────────────────
  max-phase1-concurrent: 3

# ================================
# PAPER TRADING
# ================================
paper-trading:
  initial-capital: ${PAPER_CAPITAL:${TRADING_CAPITAL:100000}}
  sl-slip-pct: 0.001
  target-slip-pct: 0.0005
  eod-slip-pct: 0.0015
  brokerage: 40.0

# ================================
# RISK CONTROL
# ================================
circuit-breaker:
  # 10-2-3 Slot Manager: max 10 trades per day
  max-trades-per-day: 10

  daily-loss-cap-pct: -3.5
  weekly-drawdown-cap-pct: -8.0
  monthly-drawdown-cap-pct: -15.0

  # ── Dynamic Trailing Profit Floor ─────────────────────────────────────
  profit-lock-trigger-pct: 6.0
  profit-floor-pct: 4.0
  giveback-multiplier: 2.0
  min-giveback-pct: 0.5

# ================================
# MARKET FILTERS
# ================================
scanner:
  min-volume: 250000
  min-price: 100
  bb-width-max: 3.0
  max-sl-pct: 2.5
  cooldown-seconds: 2400
  retest-tolerance: 0.005
  min-gap-pct: 0.3
  entry-mode: ${ENTRY_MODE:AGGRESSIVE}

market:
  atr-min-pct: 0.3
  atr-max-pct: 3.0
  trend-candles: 8
  doji-body-pct: 0.10

vix:
  normal-max: 20.0
  extreme-min: 28.0
  block-trades-when-extreme: false

sector:
  min-aligned-pct: 55
  min-relative-strength: 0.8

# ================================
# STRATEGY — Global/Rvol (used by PaperTradeManagementService)
# ================================
strategy:
  enabled: true

  global:
    gravity-exhaustion-pct: 1.5
    poc-proximity-pct: 1.0
    rvol-time-slot-enabled: true
    min-rvol-trend: 1.3
    min-rvol-reversal: 1.2
    min-rvol-impulse: 1.5
    breakeven-r-trigger: 1.5
    partial-exit-r: 3.0
    trailing-mode: CANDLE_LOW
    global-time-stop: 30m
    trend-trail-trigger-r: 2.0

  rvol:
    history-days: 5
    slot-minutes: 5
    min-rvol-for-impulse: 1.5
    min-rvol-for-signal: 1.3
    min-rvol-for-spring: 1.2

  # ════════════════════════════════════════════════════════════════════════
  # SMART CHANNEL PULLBACK STRATEGY v2
  # Implements SmartChannelPullbackStrategy_v2 spec:
  #   15M market trend + 5M channel structure + pullback entry
  # ════════════════════════════════════════════════════════════════════════
  smart-channel-pullback:
    # Master switch — set to false to disable without removing code
    enabled: ${SCPS_ENABLED:true}

    # Require HIGH_QUALITY channel (≥3 touches) before firing
    # Set true for more conservative operation
    require-high-quality-channel: false

    # Time stop: exit trade if no 0.5R profit within 60 minutes
    # 0 = use global time stop from strategy.global.global-time-stop
    time-stop-minutes: 60

    # Minimum RVOL — signals still fire below this but score lower
    min-rvol: 1.0

    # Max signals per session (09:40–14:40)
    max-signals-per-session: 3

    # Sector filters
    sector-buy-threshold: 0.3    # sector must be ≥ +0.3% for BUY
    sector-sell-threshold: -0.3  # sector must be ≤ -0.3% for SELL

    # Slippage-adjusted RR pre-flight check (Gate 7.5)
    # Accounts for 0.05% entry + 0.05% exit slippage
    min-adjusted-rr: 1.8

    # Cooldown per symbol between signals (minutes)
    symbol-cooldown-minutes: 60

    # Skip channels wider than this %
    max-channel-width-pct: 5.0

    # Target multipliers
    t1-rr: 2.0
    t2-rr: 3.0

# ================================
# NOTIFICATIONS
# ================================
notifications:
  telegram:
    enabled: false
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /internal/actuator
  endpoint:
    health:
      show-details: when-authorized

resilience4j:
  retry:
    instances:
      zerodha-api:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2.0

app:
  allowed-origins: http://localhost:8081,http://127.0.0.1:8081

logging:
  level:
    root: INFO
    com.trading: TRACE
    com.zerodhatech: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN

  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

  file:
    name: logs/trading-platform.log

  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
      file-name-pattern: logs/trading-platform.%d{yyyy-MM-dd}.%i.log